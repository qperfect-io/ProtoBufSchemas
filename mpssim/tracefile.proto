syntax = "proto3";

import "mpssim/mpssim.proto";
import "mimiqcircuits/circuit.proto";

message Pair {
    int64 first = 1;
    int64 second = 2;
}

message Tracefile {
    Circuit mimiq_circuit = 1;
    MpoCircuit converted_circuit = 2;

    repeated Pair inst_to_mpo = 3;
    repeated MPSState state_evolution = 4;
}
